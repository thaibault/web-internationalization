name: Deploy documentation website
run-name: Deploy documentation website

on:
  # NOTE: Runs on branch or tag creation.
  create:
    branches:
      - main
  # Runs when a new pre-release version was prepared.
  repository_dispatch:
    types:
      - prepare-pre-release-event
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      debug:
        description: Sets "NODE_ENV" to "debug".
        default: false
        type: boolean

jobs:
  main:
    runs-on: ubuntu-latest
    container: node:lts
    # Allows pushing the built documentation to the "gh-pages" branch.
    permissions:
      contents: write

    steps:
      - uses: thaibault/web-documentation@main
        with:
          debug: ${{ inputs.debug || '' }}
